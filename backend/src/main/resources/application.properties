spring.application.name=backend

# Sesión de servidor (cookie JSESSIONID). Secure solo en el perfil prod.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# PostgreSQL (Supabase) — valores desde variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: no crear ni modificar tablas automáticamente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway: usa el mismo datasource; migraciones en classpath:db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Enlace de verificación (el token viaja solo en el query string del correo)
camido.verificacion-email.url-base=${VERIFICACION_EMAIL_URL_BASE:http://localhost:4200/verificar-email}
# true exige correo verificado para el login y envía el enlace. false solo arranca con el perfil local.
camido.verificacion-email.obligatoria=${CAMIDO_VERIFICACION_EMAIL_OBLIGATORIA:true}

# Correo: none (solo no-prod) | resend (requiere RESEND_API_KEY y RESEND_FROM)
camido.email.provider=${EMAIL_PROVIDER:none}
camido.email.resend.api-key=${RESEND_API_KEY:}
camido.email.resend.from=${RESEND_FROM:}
